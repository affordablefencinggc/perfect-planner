<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">GPT — Running Left</title>
  <desc id="desc">Recognizable OpenAI mark identifying GPT, running toward the left with a fast stride and trailing speed lines. Beige cartoon legs and sneakers are original pack artwork. Trademark belongs to its owner.</desc>
  <defs><filter id="mark-shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".2"/></filter></defs>
  <style>
          .left-leg,.right-leg { transform-box:view-box; }
          .left-leg { transform-origin:91px 158px; animation:left-step .34s ease-in-out infinite; }
          .right-leg { transform-origin:165px 158px; animation:right-step .34s ease-in-out infinite; }
          .body-motion { transform-origin:128px 104px; animation:body-motion .34s ease-in-out infinite alternate; }
          .speed-lines { animation:speed-lines .34s linear infinite; }
          @keyframes left-step { 0%,100% { transform:rotate(29deg) } 50% { transform:rotate(-29deg) } }
          @keyframes right-step { 0%,100% { transform:rotate(-29deg) } 50% { transform:rotate(29deg) } }
          @keyframes body-motion { from { transform:translate(-3px,0) rotate(-8deg) } to { transform:translate(-6px,-6px) rotate(-8deg) } }
          @keyframes speed-lines { to { stroke-dashoffset:-34 } }
          @media (prefers-reduced-motion:reduce) { .left-leg,.right-leg,.body-motion,.speed-lines { animation:none!important; } }
        </style>
