<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Gemini — Waiting</title>
  <desc id="desc">Recognizable Google mark identifying Gemini, waiting in place with a small alternating foot motion. Beige cartoon legs and sneakers are original pack artwork. Trademark belongs to its owner.</desc>
  <defs><filter id="mark-shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".2"/></filter></defs>
  <style>
          .left-leg,.right-leg { transform-box:view-box; }
          .left-leg { transform-origin:91px 158px; animation:left-step .8s ease-in-out infinite; }
          .right-leg { transform-origin:165px 158px; animation:right-step .8s ease-in-out infinite; }
          .body-motion { transform-origin:128px 104px; animation:body-motion .8s ease-in-out infinite alternate; }
          .speed-lines { animation:speed-lines .34s linear infinite; }
          @keyframes left-step { 0%,100% { transform:rotate(12deg) } 50% { transform:rotate(-12deg) } }
          @keyframes right-step { 0%,100% { transform:rotate(-12deg) } 50% { transform:rotate(12deg) } }
          @keyframes body-motion { from { transform:translateY(0) } to { transform:translateY(-3px) } }
          @keyframes speed-lines { to { stroke-dashoffset:-34 } }
          @media (prefers-reduced-motion:reduce) { .left-leg,.right-leg,.body-motion,.speed-lines { animation:none!important; } }
        </style>
  
  
