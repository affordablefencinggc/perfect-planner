name: Review bot

# Posts Go / No-go / Hold / Wait for a PR's exact head (core/reviewbot).
# Safety: pull_request_target and workflow_run both check out the BASE branch, so the bot
# that judges a PR is never the PR's own copy, and nothing here runs the PR's code.
# It reads the PR through the API only. Linux only, no build, so the size rule is not measured here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # Re-judge when the PR's checks finish, so WAIT turns into GO or NO-GO.
  workflow_run:
    workflows: ["Perfect Planner Guardrail CI", "Core loop CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: read

concurrency:
  group: review-bot-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: Review bot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.pull_requests[0].number
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/review-bot.mjs --pr "$PR_NUMBER" --expected-green 6 --post
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
