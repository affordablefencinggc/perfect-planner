name: Real OS keychain

# Signing keys in the real OS keychain on each OS: Windows Credential
# Locker and the Linux Secret Service (gnome-keyring in a private D-Bus
# session). It installs system packages and starts a keyring daemon, so it
# is a platform probe, not a gate the app can reproduce locally; the
# provider's logic is tested in Core loop CI. Linux runs on every push;
# Windows runs on main, release tags and manual runs.
on:
  push:
    paths-ignore: ["*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keychain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keychain:
    name: Real keychain on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    env:
      PP_KEYCHAIN_TEST: "1"
      PP_KEYCHAIN_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Keychain (Windows)
        if: runner.os == 'Windows'
        run: npx vitest run -c vitest.core.config.mjs core/ledger/keychain.test.ts --reporter=verbose
      - name: Keychain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus
          dbus-run-session -- sh -c 'printf "ci-only-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && npx vitest run -c vitest.core.config.mjs core/ledger/keychain.test.ts --reporter=verbose'
