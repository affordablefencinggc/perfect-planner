name: Core loop CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-loop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core loop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:core
      - run: npm run test:core
      # Signing keys in the real OS keychain: Credential Locker, the macOS
      # keychain, and the Secret Service (gnome-keyring in a private session).
      - name: Real OS keychain (Windows, macOS)
        if: runner.os != 'Linux'
        env:
          PP_KEYCHAIN_TEST: "1"
          PP_KEYCHAIN_REQUIRED: "1"
        run: npx vitest run -c vitest.core.config.mjs core/ledger/keychain.test.ts --reporter=verbose
      - name: Real OS keychain (Linux)
        if: runner.os == 'Linux'
        env:
          PP_KEYCHAIN_TEST: "1"
          PP_KEYCHAIN_REQUIRED: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus
          dbus-run-session -- sh -c 'printf "ci-only-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && npx vitest run -c vitest.core.config.mjs core/ledger/keychain.test.ts --reporter=verbose'
