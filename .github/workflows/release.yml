name: Perfect Planner Release

# Builds the desktop installers for Windows, macOS and Linux.
# - Push a tag R-<n> (e.g. R-2): builds everything and attaches it to a DRAFT
#   GitHub Release for that tag. Nothing is published; a person does that.
# - Run workflow (manual): builds everything as a dry run and keeps the
#   installers as workflow artifacts. Tick "draft_release" to also make a draft.
# - Push to a release/** branch: same dry run, no release.
# No pull_request trigger on purpose: the truth report treats every
# pull_request job as a locally reproducible merge gate (src/node/ciDerivation.mjs).
on:
  push:
    tags: ["R-*"]
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release stamp for the file names (e.g. R-2). Leave as dry-run for a test build."
        default: dry-run
        required: true
      draft_release:
        description: "Also create a draft GitHub Release (needs a release stamp other than dry-run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: perfect-planner-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event_name == 'workflow_dispatch' && inputs.release || 'dry-run' }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundles: msi,nsis
            args: ""
          # Two native DMGs: Tauri's universal bundler skips the planner-agent-helper sidecar.
          - os: macos-latest
            platform: macos-arm64
            bundles: dmg
            args: --target aarch64-apple-darwin
          - os: macos-latest
            platform: macos-x64
            bundles: dmg
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux-x64
            bundles: deb,rpm,appimage
            args: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check release stamp
        shell: bash
        run: |
          if [[ ! "$RELEASE_NAME" =~ ^(dry-run|R-[0-9]+)$ ]]; then
            echo "::error::Release stamp must be dry-run or R-<number>, got '$RELEASE_NAME'"; exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-09
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform }}

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci

      # The truth report's proof runner refuses temp paths that are not canonical:
      # Windows runners hand out 8.3 short names, macOS a /var -> /private/var symlink.
      - name: Use a canonical temp dir
        run: node scripts/prepare-native-ci-env.mjs

      - name: Build installers
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      # The core loop (Tasks, Connect agent) runs on the local Node host, which the
      # installers do not bundle yet. This zip runs that host from a double-click.
      - name: Stage portable loop build
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          set -euo pipefail
          out=portable/PerfectPlanner-preview
          rm -rf portable && mkdir -p "$out/dist" "$out/scripts"
          cp -r dist/client dist/core-host "$out/dist/"
          cp -r src "$out/src"
          cp scripts/serve-local.mjs "$out/scripts/"
          # Only the core host's runtime packages; the client is prebuilt.
          node -e 'const p=require("./package.json"),l=require("./package-lock.json").packages,d={};for(const n of ["@modelcontextprotocol/sdk","zod"])d[n]=l["node_modules/"+n].version;require("fs").writeFileSync(process.argv[1],JSON.stringify({name:"perfect-planner-preview",private:true,type:p.type,version:p.version,dependencies:d},null,2))' "$out/package.json"
          (cd "$out" && npm install --omit=dev --ignore-scripts --no-audit --no-fund)
          printf '%s\r\n' '@echo off' 'cd /d "%~dp0"' 'where node >nul 2>nul || (echo Perfect Planner needs Node.js 20 or newer: https://nodejs.org & pause & exit /b 1)' 'set PP_OPEN=1' 'node scripts\serve-local.mjs' 'pause' > "$out/Start Perfect Planner.cmd"
          printf '%s\n' '#!/bin/sh' 'cd "$(dirname "$0")"' 'PP_OPEN=1 exec node scripts/serve-local.mjs' > "$out/start-perfect-planner.sh"
          chmod +x "$out/start-perfect-planner.sh"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.platform == 'windows-x64'
        with:
          name: PerfectPlanner-${{ env.RELEASE_NAME }}-portable-loop
          path: portable/
          if-no-files-found: error
          retention-days: 14

      - name: Stamp installer names
        run: node scripts/release/stamp-artifacts.mjs --release ${{ env.RELEASE_NAME }} --platform ${{ matrix.platform }} --out release-out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PerfectPlanner-${{ env.RELEASE_NAME }}-${{ matrix.platform }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Attach to draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.draft_release && inputs.release != 'dry-run')
    runs-on: ubuntu-latest
    # Protect this in Settings -> Environments -> release (see README "Making a release").
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-out
          merge-multiple: true
      - name: Write release notes
        run: node scripts/release/release-notes.mjs --release "$RELEASE_NAME" --dir release-out > release-notes.md
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Perfect Planner $RELEASE_NAME"
          if gh release view "$RELEASE_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_NAME" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::$RELEASE_NAME is already published; refusing to change it"; exit 1
            fi
            gh release edit "$RELEASE_NAME" --notes-file release-notes.md
            gh release upload "$RELEASE_NAME" release-out/* --clobber
          else
            gh release create "$RELEASE_NAME" release-out/* --draft --verify-tag=${{ startsWith(github.ref, 'refs/tags/') }} \
              --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md
          fi
          echo "Draft release: $(gh release view "$RELEASE_NAME" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
