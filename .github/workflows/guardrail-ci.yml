name: Perfect Planner Guardrail CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: perfect-planner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-contracts:
    name: Web, contracts, MCP, and Sites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows builds and runs the node suite far slower than Linux/macOS (measured ~25 min on main).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # The app's stores refuse any aliased ancestor by design. macOS's default temp dir sits
    # behind /var -> /private/var and Windows runners hand out an 8.3 short TEMP path
    # (RUNNER~1), so each step points test fixtures at the runner's real temp dir
    # (TMPDIR for macOS/Linux, TEMP/TMP for Windows; runner.* is only available per step).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run verify:secrets
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run build
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run verify:performance
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run test:report
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run test:ui:report
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run verify:mcp -- --fixture
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run test:sites
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

  windows-native:
    name: Windows native compile and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-09
      - run: npm ci
      - run: node scripts/prepare-native-ci-env.mjs
      - run: npm run test:native
      - run: npm run tauri:build -- --no-bundle
