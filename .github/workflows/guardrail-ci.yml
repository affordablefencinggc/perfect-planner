name: Perfect Planner Guardrail CI

on:
  # Draft PR heads run Linux only. Windows joins when the PR is marked ready
  # for review (its final head before merge), on main, and on release tags.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # No paths-ignore here: this workflow runs the app map coverage test, which
  # fails when a new Markdown file is not listed in appMapRegistry.js.
  push:
    branches: [main]
    tags: ["R-*"]

permissions:
  contents: read

concurrency:
  group: perfect-planner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-contracts:
    name: Web, contracts, MCP, and Sites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Measured on windows-latest: build ~5 min, core tests ~12 min, UI tests ~8 min
    # (each vitest file pays ~6 s of jsdom/import setup there), so 25 min cannot fit.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    # The app's stores refuse any aliased ancestor by design. Windows runners hand out an
    # 8.3 short TEMP path (RUNNER~1), so each step points test fixtures at the runner's
    # real temp dir (TMPDIR for Linux, TEMP/TMP for Windows; runner.* is only available per step).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run verify:secrets
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run build
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run verify:performance
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run test:report
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run test:ui:report
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run verify:mcp -- --fixture
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run test:sites
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

  windows-native:
    name: Windows native compile and tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-09
      - run: npm ci
      - run: node scripts/prepare-native-ci-env.mjs
      - run: npm run test:native
      - run: npm run tauri:build -- --no-bundle
