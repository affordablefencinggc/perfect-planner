name: Perfect Planner Guardrail CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: perfect-planner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-contracts:
    name: Web, contracts, MCP, and Sites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Measured on windows-latest: build ~5 min, core tests ~12 min, UI tests ~8 min
    # (each vitest file pays ~6 s of jsdom/import setup there), so 25 min cannot fit.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # The app's stores refuse any aliased ancestor by design. macOS's default temp dir sits
    # behind /var -> /private/var and Windows runners hand out an 8.3 short TEMP path
    # (RUNNER~1), so each step points test fixtures at the runner's real temp dir
    # (TMPDIR for macOS/Linux, TEMP/TMP for Windows; runner.* is only available per step).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run verify:secrets
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run build
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run verify:performance
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run test:report
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run test:ui:report
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run verify:mcp -- --fixture
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run test:sites
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

  windows-native:
    name: Windows native compile and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: node scripts/prepare-native-ci-env.mjs
      - run: npm run test:native
      - run: npm run tauri:build -- --no-bundle
